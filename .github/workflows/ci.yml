name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: build shared library
        run: |
          ext=so
          [ "$(uname)" = "Darwin" ] && ext=dylib
          CGO_ENABLED=1 go build -buildmode=c-shared -o "opencode-cloak.$ext" .
          ls -la "opencode-cloak.$ext"
